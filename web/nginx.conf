# nginx.conf — Leila One : la SPA et l'API sur la MÊME origine.
# Le navigateur ne parle qu'à ce serveur ; l'API n'est joignable que par lui.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # En-têtes de sécurité (style-src 'unsafe-inline' : attributs style de React)
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;

  location /api/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Écrasé (et non complété) : un client ne peut pas choisir son IP vue par l'API
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
  }

  # Les points d'accès techniques de l'API ne sont pas publiés
  location = /healthz { return 404; }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
  }

  # Routes de la SPA (/employees/12, /gestion…) : index.html
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
  }
}
