# docker compose up --build                    → Leila One sur http://localhost:4321
#                                                (adapter et identité choisis dans api/.env)
# docker compose --profile odoo-local up       → + une Odoo 18 locale avec leila_hr
# docker compose --profile debug run odoo-check → curl -v sur ODOO_URL (diagnostic réseau)

name: poc-odoo-repository

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file:
      - path: ./api/.env
        required: false # sans .env : ADAPTER=mock + AUTH_MODE=fake-jwt (démo)
    environment:
      API_PORT: "3001"
      # L'API n'est joignable que par nginx, qui écrase X-Forwarded-For : on peut s'y fier
      TRUST_PROXY: "1"
    # SEC-001 : l'API n'est PAS publiée sur l'hôte. Seul le front (reverse proxy)
    # la joint, par le réseau interne de compose.
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    # SPA React servie par nginx, qui relaie /api vers l'API (même origine)
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "4321:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ─── Profil odoo-local : une base de recette jetable ───────────────────────
  # Dans api/.env : ADAPTER=odoo et ODOO_URL=http://odoo:8069
  # Puis créer la base sur http://localhost:8069 et installer leila_hr.
  db:
    image: postgres:16-alpine
    profiles: ["odoo-local"]
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - odoo-db:/var/lib/postgresql/data

  odoo:
    image: odoo:18
    profiles: ["odoo-local"]
    depends_on:
      - db
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    ports:
      - "8069:8069"
    volumes:
      - odoo-data:/var/lib/odoo
      # Chemin vers le module leila_hr (dossier contenant __manifest__.py)
      - ${LEILA_HR_PATH:-../leila_hr}:/mnt/extra-addons/leila_hr:ro

  # ─── Profil debug : ton Dockerfile racine (curl -v $ODOO_URL) ──────────────
  odoo-check:
    build: .
    profiles: ["debug"]
    env_file:
      - path: ./api/.env
        required: false

volumes:
  odoo-db:
  odoo-data:
